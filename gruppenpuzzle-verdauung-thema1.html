            (t.diffMode ? [0, 1, 2].filter(l => t.levels[l]).map(l => '<h3>' + stars(l) + ' ' + LN[l] + '</h3>' +
                (t.perLevel && textOf(t, l) ? '<div class="card"><span class="k">Aufgabe</span><div class="body">' + textOf(t, l) + '</div></div>' : '') + block(t['steps' + (l + 1)] || [])).join('') : block(t.steps || []))).join('') + '</div>';
        math(app);
    }

    if (PRE === 'sheet') sheet();
    else if (PRE) {
        // Vorschau im Editor: direkt die gerade bearbeitete (Teil-)Aufgabe im passenden Niveau zeigen
        const leaf = Math.max(0, Math.min(CFG.startTask || 0, tasks.length - 1)), gi = Math.max(0, groups.findIndex(g => g.items.includes(leaf)));
        const t = tasks[leaf], ls = gLevels(groups[gi]);
        if (ls.length > 1) mem['G' + gi] = hasLv(t) ? t.level : (ls.includes(CFG.previewLevel) ? CFG.previewLevel : ls[0]);
        ghGroup(gi, leaf);
    }
    else if (groups.length === 1) ghGroup(0);
    else ghList();
})();
</script>
