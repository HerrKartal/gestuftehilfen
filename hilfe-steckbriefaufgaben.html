*{box-sizing:border-box;margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);line-height:1.55;font-size:17px;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wrap{max-width:660px;margin:0 auto;padding:18px 16px 170px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .tt{flex:1;min-width:0}
.top small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-family:var(--display);font-weight:var(--dw);font-size:1.45rem;line-height:1.2;letter-spacing:-.015em}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex-shrink:0}
.ib:hover{color:var(--accent);border-color:var(--accent)}
.pill{height:28px;padding:0 11px;border-radius:999px;background:var(--surface2);font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;color:var(--ink2);flex-shrink:0}
.segs{display:flex;gap:6px;margin-bottom:16px}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--line);transition:background .4s}
.segs i.on{background:var(--accent)} .segs i.sol.on{background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-bottom:12px;box-shadow:var(--shadow);overflow-wrap:break-word}
.k{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.body img{max-width:100%;border-radius:10px;margin-top:10px;display:block}
.body a{color:var(--accent);font-weight:600}
.body ul,.body ol{padding-left:22px}
.hint{animation:hintIn .5s cubic-bezier(.2,.7,.2,1)}
.hint.noanim{animation:none}
@keyframes hintIn{from{opacity:0;transform:translateY(10px)}}
.hh{display:flex;align-items:center;gap:9px;font-weight:700;font-size:.85rem;color:var(--accent);margin-bottom:5px}
.hh>i{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-style:normal;font-size:.78rem}
.hh>i svg{width:14px;height:14px}
.hh .zb{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px;border-radius:8px;display:grid}
.hh .zb:hover{color:var(--accent);background:var(--surface2)}
.hint.sol{border-color:var(--ok);background:var(--ok-soft)}
.hint.sol .hh{color:var(--ok)} .hint.sol .hh>i{background:var(--ok);color:#fff}
.ext{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:11px;border-radius:12px;background:var(--surface);border:1px solid var(--ok);text-decoration:none;color:var(--ok)!important}
.next{position:fixed;left:0;right:0;bottom:0;padding:26px 16px 18px;background:linear-gradient(transparent,var(--bg) 34%);pointer-events:none}
.next-in{max-width:628px;margin:0 auto;pointer-events:auto}
.think{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.tslot{display:grid;place-items:center;margin-bottom:10px}
.tslot:empty{display:none}
.tl{display:flex;flex-direction:column;gap:10px}
.tl button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;animation:hintIn .5s cubic-bezier(.2,.7,.2,1) backwards}
.tl button:hover{transform:translateY(-2px);border-color:var(--accent)}
.tl .tn{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex-shrink:0;color:var(--ink2)}
.tl .tn.part{background:var(--accent-soft);color:var(--accent)} .tl .tn.done{background:var(--ok);color:#fff}
.tl .tx{flex:1;min-width:0} .tl .tx b{display:block;font-size:1.02rem} .tl .tx small{color:var(--muted);font-size:.82rem}
.tl button>svg{color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lv button{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 10px;cursor:pointer;text-align:center;transition:.2s;box-shadow:var(--shadow)}
.lv button:hover{border-color:var(--gold);transform:translateY(-3px)}
.lv .st{display:block;color:var(--gold);font-size:1.5rem;letter-spacing:1px}
.lv b{display:block;margin-top:2px} .lv small{color:var(--muted);font-size:.8rem}
.sub{display:block;margin:6px auto 0;border:0;background:transparent;color:var(--muted);font-size:.82rem;text-decoration:underline;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:50;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.zc{background:var(--surface);color:var(--ink);border-radius:22px;padding:44px 40px;width:100%;max-width:900px;max-height:90vh;overflow:auto;font-size:1.6rem;line-height:1.6;position:relative}
.zc .ib{position:absolute;top:14px;right:14px}
.sheet h2{font-family:var(--display);font-weight:var(--dw);font-size:1.2rem;margin:22px 0 10px}
.sheet h3{font-size:.85rem;color:var(--gold);margin:14px 0 8px;letter-spacing:.03em}

.tm{width:104px;height:104px;display:block}
.tm .trk{fill:none;stroke:var(--line);stroke-width:7}
.tm .prg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;transition:stroke .3s}
.tm .num{font:700 26px var(--ui);fill:var(--ink)}
.tm.done .prg{stroke:var(--ok)} .tm.done .num{fill:var(--ok)}
.stairs rect{fill:var(--line);transition:fill .35s}
.stairs rect.lit{fill:var(--accent)} .stairs.done rect{fill:var(--ok)}
.tbar{width:100%;max-width:340px}
.tbar .bt{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.tbar .bt b{font-variant-numeric:tabular-nums}
.tbar .bb{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.tbar .bb i{display:block;height:100%;border-radius:9px;background:var(--accent);width:0}
.tbar.done .bb i{background:var(--ok)} .tbar.done .bt{color:var(--ok)}
.lockr .shk{fill:none;stroke:var(--ink2);stroke-width:5;stroke-linecap:round;transition:transform .5s cubic-bezier(.3,1.6,.5,1),stroke .3s;transform-box:fill-box;transform-origin:85% 100%}
.lockr .bd{fill:var(--ink2);transition:fill .3s}
.lockr.done .shk{transform:rotate(38deg) translateY(-3px);stroke:var(--ok)} .lockr.done .bd{fill:var(--ok)}
.bulb .ray{stroke:var(--gold);stroke-width:4;stroke-linecap:round;opacity:0;transition:opacity .4s}
.bulb.done .ray{opacity:1;animation:tw 1.2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.45}}
.wave path{animation:wv 2.4s linear infinite}
@keyframes wv{to{transform:translateX(-50px)}}
.nbtn{position:relative;width:100%;min-height:54px;border-radius:var(--btn-r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink2);font:700 16px var(--ui);overflow:hidden;cursor:pointer;display:grid;place-items:center;padding:0 16px;font-variant-numeric:tabular-nums}
.nbtn .f{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent-soft)}
.nbtn span{position:relative}
.nbtn:disabled{cursor:default}
.nbtn.ready{background:var(--accent);border-color:transparent;color:var(--on-accent);animation:nbpop .45s cubic-bezier(.3,1.6,.5,1)}
.nbtn.ready .f{display:none}
.nbtn.solb.ready{background:var(--ok)}
@keyframes nbpop{0%{transform:scale(.96)}60%{transform:scale(1.03)}}
</style>

[{"title":"Station 1: WANTED","text":null,"diffMode":false,"levels":[true,true,true],"steps":[{"time":0,"message":"Das <b>Ziel<\/b> einer so genannten „Steckbriefaufgabe“ ist es, aus den gegebenen Informationen über die Funktion, die \\(\\textbf{Funktionsgleichung}\\)  aufzustellen.<br>\nNotieren Sie zunächst die <b>allgemeine Funktionsgleichung<\/b>  und <b>die ersten beiden Ableitungen<\/b> mit den unbekannten Koeffizienten: <b>a,b,c<\/b> und <b>d<\/b>. Die gesuchte Funktion ist eine ganzrationale Funktion dritten Grades, also gilt:\n\\[f(x)=a\\cdot x^3+b\\cdot x^2+c\\cdot x+d\\]\nBilden Sie zudem die ersten beiden Ableitungen. \n<br>\n\n\n\\(f'(x)=\\) \n<br>                                      \n\\(f''(x)=\\)   ","image":null},{"time":0,"message":"Kreisen Sie alle gegebenen Informationen über die Funktion aus dem Steckbrief ein. \n<br>\nNehmen Sie sich Schritt für Schritt eine Information vor. \n<br> <br>\nBeginnen Sie z.B. mit der Information, dass die Funktion durch den Ursprung verläuft:<br>\nDas bedeutet, dass die Funktion durch den Punkt \\(P(0│0)\\) verläuft.<br> <br>\nDiese Information muss nun in eine Gleichung übersetzt werden: \\(f(0)=0\\) <br>\nEinsetzen in die allgemeine Gleichung liefert:    \n\n\\[f(0)=a\\cdot 0^3+b\\cdot0^2+c\\cdot0+d=d=0\\]\n\nNun kann geschlussfolgert werden, dass \\(d=0\\) ist. <br>\n\nÜbersetzen Sie nun auch die anderen Informationen in Gleichungen.    ","image":null},{"time":0,"message":"Die Funktion hat an der Stelle \\(x=1\\) ein <b>Minimum<\/b>. <br> <br>\n    Denken Sie an die Bestimmung von Extremwerten im Unterricht.  <br>\n\n    Stellen Sie die notwendige Bedingung dafür auf.<br><br>\n    \n    Die Funktion  hat in \\(W\\left( \\frac{2}{3}│\\frac{2}{27}\\right)\\) einen \\(\\textbf{Wendepunkt}\\). <br><br>\n    Denken Sie an die Bestimmung von Wendestellen im Unterricht. Stellen Sie die <b>notwendige Bedingung<\/b> dafür auf. <br>\n\n    Die Information des Wendepunktes enthält noch eine weitere Information, denn es wird ein konkreter Punkt angegeben. <br><br>\n    Es lässt sich eine weitere Gleichung aufstellen. ","image":null},{"time":0,"message":"Es ergeben sich folgende Gleichungen:<br> <br>\n<li>Verlauf durch der Ursprung: P(0│0) \n\n  \\(\\rightarrow\\) \\(f(0)=d=0\\) \\(\\rightarrow\\) \\(d=0\\) <br>\n  \\(\\rightarrow\\) Reduzierung der Funktion auf \\(f(x)=ax^3+bx^2+cx\\) <br>\n  \\(\\rightarrow\\) nur noch drei Variablen<br> <br>\n<\/li> \n\n\n<li> Minimum bei x=1 <\/li>\n\\(\\rightarrow\\) \\(f´(1)=3a+2b+c=0 \\) <br> <br>\n<li> Wendepunkt in \\(W\\left( \\frac{2}{3}│\\frac{2}{27}\\right)\\) (zwei Informationen: konkreter Punkt und Wendestelle)<\/li> \n\\(\\rightarrow\\) \\(f(\\frac{2}{3})=\\frac{8}{27} a+ \\frac{4}{9} b+\\frac{2}{3} c=\\frac{2}{27}\\)       und     \\(f\"(\\frac{2}{3})=4a+2b=0\\) <br> <br>\nEs sind noch drei Gleichungen und drei Unbekannte. Gleichungssysteme können Sie lösen.\n\t\t\t\t\t\t\t  ","image":null},{"time":0,"message":"Es ergibt sich folgendes Gleichungssystem (mit drei Gleichungen und drei Unbekannten):\n\\[ \\begin{align}\n I  &      &    3a+ 2b+    c=0\\\\\n II  &      &    4a+ 6b+ 9c=1\\\\\n III  &      &  4a+ 2b           =0\\\\\n \\end{align}\n\\]\n Schlagen Sie das <b>Einsetzungs- oder das Gleichsetzungsverfahren<\/b> in Ihren Unterlagen nach. <br> <br>\n \n Beispiel Einsetzungsverfahren: Beginnen Sie mit der Umstellung von III nach a und setzen Sie dies in I und in II ein.","image":null},{"time":0,"message":"a in I und II einsetzen ergibt:\n\n\\[ \\begin{align}\nI´ & &            3\\cdot(-0,5b)+ 2b+    c&=0   \\\\\nII´   & &         4\\cdot(-0,5b)+ 6b+ 9c&=1    \\\\\n\\end{align}\n\\]\nFassen Sie diese Gleichungen zusammen und stellen Sie beispielsweise I nach c um. <br> <br>\n\nWenn Sie b berechnet haben, können Sie auch a berechnen (siehe Gleichung III).\n\t\t\t\t\t\t\t\t  ","image":null},{"time":0,"message":"Die allgemeine Gleichung für die Funktion lautet\n\\[ f(x)=ax^3+bx^2+cx    \\qquad     (d=0)\\]\n \n Setzen Sie die berechneten Werte für a,b und c in die Funktionsgleichung ein. Sie erhalten die gesuchte Funktion.","image":null},{"time":60,"message":"Sie erhalten die Funktion:  \\[f(x)=x^3-2x^2+x\\]","url":"http://kartal-schule.bplaced.net//HTML/Steckbriefaufgaben/Station1WANTED.pdf","image":null,"isSolution":true}],"steps1":[],"steps2":[],"steps3":[],"solution":"Sie erhalten die Funktion:  \\[f(x)=x^3-2x^2+x\\]","solutionUrl":"http://kartal-schule.bplaced.net//HTML/Steckbriefaufgaben/Station1WANTED.pdf","solutionTime":60,"showSolution":true},{"title":"Station 3: Trainingslager (Lösungen)","text":null,"diffMode":false,"levels":[true,true,true],"steps":[{"time":60,"message":"","url":"http://kartal-schule.bplaced.net/HTML/Steckbriefaufgaben/Station3Trainingslagerdetailliert.pdf","image":null,"isSolution":true}],"steps1":[],"steps2":[],"steps3":[],"solution":"","solutionUrl":"http://kartal-schule.bplaced.net/HTML/Steckbriefaufgaben/Station3Trainingslagerdetailliert.pdf","solutionTime":60,"showSolution":true},{"title":"Station 4","text":null,"diffMode":false,"levels":[true,true,true],"steps":[{"time":0,"message":"Notieren Sie zunächst die allgemeine Funktionsgleichung und die ersten beiden Ableitungen mit den unbekannten Koeffizienten: b,c, und d. \n<br><br>\nDie gesuchte Funktion ist eine ganzrationale Funktion dritten Grades mit a=1 (siehe Abbildung auf dem Arbeitsblatt), also gilt:\n\n\n\n\\[ \\begin{align}\n\tf(x)&=x^3+bx^2+cx+d\\\\\n  f'(x)&=\n\\end{align}\n\\]","image":null},{"time":0,"message":"Kreisen Sie alle markanten Punkte der Funktion in der Abbildung auf dem Arbeitsblatt ein. \n<br>\nNehmen Sie sich Schritt für Schritt eine Information vor.\n<br><br>\nBeginnen Sie beispielsweise mit der Information, dass sich an der Stelle \\(x=-1\\) ein Hochpunkt befindet: \\(H(-1|2)\\).","image":null},{"time":0,"message":"Die Funktion  hat in \\(H(-1│2)\\) einen Hochpunkt. <br>\n Denken Sie an die Bestimmung von Extremwerten im Unterricht. <br>\n Stellen Sie die notwendige Bedingung dafür auf. <br><br>\nDie Information des Hochpunktes enthält noch eine weitere Information, denn es wird ein konkreter Punkt angegeben. \n<br>\nEs lässt sich eine weitere Gleichung aufstellen. <br><br>\n\nEs lässt sich noch ein weiterer Punkt ablesen.","image":null},{"time":0,"message":"Es ergeben sich folgende drei Gleichungen: <br>\n\n<li>\tf besitzt einen Hochpunkt in \\(H(-1|2)\\)  (zwei Informationen!):<\/li>\n\\(\\rightarrow\\) \\(f(-1)=…=2\\) <br>\n\\(\\rightarrow\\) \\(f´(-1)=…=0\\)\n<li>\tPunkt \\(P(0|1)\\)<\/li>\n\\(\\rightarrow\\) \\(f(0)=…=1 \\)    \n","image":null},{"time":0,"message":"Es ergibt sich folgendes Gleichungssystem:\n\n\\begin{align}\nI  &&          -1+  b-c+d&=2 \\\\\nII         &&      3-2b+c        &=0\\\\\nIII              &&                          d&=1                          &&\\rightarrow d=1\n\\end{align}\nSetzen Sie d in I ein und vereinfachen Sie die Gleichungen I und II. <br>\nLösen Sie das Gleichungssystem (schlagen Sie dazu das Einsetzungs- oder das Gleichsetzungsverfahren in Ihren Unterlagen nach). \n\n","image":null},{"time":0,"message":"Einsetzen von d und Umstellen ergibt:\n\\begin{align}\nI    &&            b-c&=2\\\\\nII    &&  -2b+c &=-3\\\\\n\\end{align}\n\nNun können Sie beispielsweise I nach b umstellen und b anschließend in II einsetzen. ","image":null},{"time":0,"message":"Die allgemeine Gleichung für die Funktion lautet\n\\[\nf(x)=x^3+bx^2+cx+d\n\\]\nSetzen Sie die berechneten Werte für \\(a,b\\) und \\(c\\) in die Funktionsgleichung ein. \n<br>\nSie erhalten die gesuchte Funktion.\n","image":null},{"time":60,"message":"\n\\[\nf(x)=x^3+x^2-x+1\n\\]\n","url":"http://kartal-schule.bplaced.net/HTML/Steckbriefaufgaben/Station4Rekonstruktion_Losungen.pdf","image":null,"isSolution":true}],"steps1":[],"steps2":[],"steps3":[],"solution":"\n\\[\nf(x)=x^3+x^2-x+1\n\\]\n","solutionUrl":"http://kartal-schule.bplaced.net/HTML/Steckbriefaufgaben/Station4Rekonstruktion_Losungen.pdf","solutionTime":60,"showSolution":true},{"title":"Station 5: Skateboard-Bahn","text":null,"diffMode":false,"levels":[true,true,true],"steps":[{"time":0,"message":"Zunächst müssen Sie wissen, welchen Grad die gesuchte Funktion hat. Der Skizze können Sie entnehmen, dass es einen Wendepunkt gibt, d.h. die zweite Ableitung enthält \\(x^1\\).\n<br><br>\nNotieren Sie die allgemeine Funktionsgleichung und die ersten beiden Ableitungen mit den unbekannten Koeffizienten.  \n","image":null},{"time":0,"message":"\nDie gesuchte Funktion ist dritten Grades. Die allgemeine Funktionsgleichung lautet also: <br>\n\\[f(x)=ax³+bx²+cx+d\\]\n","image":null},{"time":0,"message":"Kreisen Sie alle markanten Punkte der Funktion in der Abbildung auf dem Arbeitsblatt ein. \n<br> <br>\nNehmen Sie sich Schritt für Schritt eine Information vor.","image":null},{"time":0,"message":"<li>Die Funktion ist symmetrisch zum Koordinatenursprung. Inwiefern hat dies Einfluss auf die allgemeine Funktionsgleichung?<\/li> \n<li>Die Funktion  hat in \\(W(0│0)\\) einen Wendepunkt. <\/li> \n<li>Die Funktion hat zwei Extrempunkte \\(H(-2|1,5)\\) und \\(T(2|-1,5)\\).<\/li> ","image":null},{"time":0,"message":"Es ergeben sich folgende drei Gleichungen: <br> <br>\n\n<li>\tf ist symmetrisch zum Koordinatenursprung<\/li>\n\\(\\rightarrow\\) nur ungerade Exponenten <br>\n\\(\\rightarrow\\) \\(b=0\\) und \\(d=0\\) <br>\n\\(\\rightarrow\\) es ergibt sich eine neue Ausgangsfunktion: \\(f(x)=ax³+cx\\)\n\t<li> Wendepunkt in \\(W(0|0\\))<\/li>\n\t\\(\\rightarrow\\) \\(f(0)=a\\cdot 0³+c\\cdot 0=0\\)  \\(\\rightarrow\\) keine zielführende Gleichung: 0=0  <br>\n\t\\(\\rightarrow\\) \\(f´´(0)=6a\\cdot 0=0\\)        \\(\\rightarrow\\)    keine zielführende Gleichung: 0=0  \n<li>\tExtrempunkt T(2|-1,5)          [ebenso: H(-2|1,5)]      <\/li>\n\\(\\rightarrow\\) \\(f(2)=…=-1,5 \\)      &nbsp;&nbsp;&nbsp;                \\([f(-2)=…=1,5]  \\) <br>                  \n\\(\\rightarrow\\) \\(f´(2)=…=0 \\)            &nbsp;&nbsp;&nbsp;&nbsp;  &nbsp;&nbsp;        \\(     [f´(-2)=…=0]\\) \n\n"         if (tasks.length === 1) ghOpen(0); else ghList();
    };
    const tools = () => '<button class="ib" onclick="ghDark()" title="Hell / Dunkel">' + IC.moon + '</button>' + (PRE ? '' : '<button class="ib" onclick="ghReset()" title="Von vorn beginnen">' + IC.reset + '</button>');

    window.ghList = function () {
        stop(); cur = -1; const p = getP();
        app.innerHTML = '<div class="wrap"><div class="top"><div class="tt"><small>Gestufte Hilfen</small><h1>' + esc(CFG.title || 'Aufgaben') + '</h1></div>' + tools() + '</div><div class="tl">' +
            tasks.map((t, i) => {
                const n = path(t, p['L' + i] === undefined ? firstLevel(t) : p['L' + i]).length, d = p[i] || 0, st = (n > 0 && d >= n) ? 'done' : (d > 0 ? 'part' : '');
                return '<button onclick="ghOpen(' + i + ')" style="animation-delay:' + (i * .06) + 's"><span class="tn ' + st + '">' + (st === 'done' ? IC.check : i + 1) + '</span><span class="tx"><b>' + esc(name(t, i)) + '</b><small>' +
                    (st === 'done' ? 'Alle Hilfen angesehen' : (d > 0 ? d + ' von ' + n + ' Schritten angesehen' : (t.diffMode ? 'Hilfen in mehreren Niveaus' : 'Hilfen verfügbar'))) + '</small></span>' + IC.right + '</button>';
            }).join('') + '</div></div>';
    };

    function drawSegs() { const s = $('segs'); if (s) s.innerHTML = steps.map((x, k) => '<i class="' + (k < idx ? 'on' : '') + (x.isSolution ? ' sol' : '') + '"></i>').join(''); }

    function stepHtml(s, n) {
        return '<div class="hh"><i>' + (s.isSolution ? IC.check : n) + '</i>' + (s.isSolution ? 'Lösung' : 'Hilfe ' + n) + '<button class="zb" title="Groß anzeigen">' + IC.zoom + '</button></div><div class="body">' +
            (s.message || '') + (s.image ? '<img src="' + s.image + '" alt="">' : '') +
            (s.isSolution && s.url ? '<a class="ext" href="' + esc(s.url) + '" target="_blank" rel="noopener">' + IC.link + 'Ausführliche Lösung öffnen</a>' : '') + '</div>';
    }
    function zoom(html) {
        const o = document.createElement('div'); o.className = 'ov';
        o.innerHTML = '<div class="zc"><button class="ib" title="Schließen">' + IC.x + '</button><div class="body">' + html + '</div></div>';
        o.onclick = e => { if (e.target === o || e.target.closest('.ib')) o.remove(); };
        document.body.appendChild(o); math(o);
    }
    function reveal(instant) {
        const s = steps[idx], d = document.createElement('div');
        d.className = 'card hint' + (s.isSolution ? ' sol' : '') + (instant ? ' noanim' : '');
        d.innerHTML = stepHtml(s, idx + 1);
        const raw = (s.message || '') + (s.image ? '<img src="' + s.image + '" alt="">' : '');
        d.querySelector('.zb').onclick = () => zoom(raw);
        $('area').appendChild(d); math(d); idx++;
        if (!instant) {
            const p = getP(); if ((p[cur] || 0) < idx) { p[cur] = idx; putP(p); }
            setTimeout(() => d.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
        }
        drawSegs();
    }

    function arm() {
        stop(); const box = $('next'), t = tasks[cur];
        if (PRE === 'all') { box.parentNode.style.display = 'none'; return; }
        if (idx >= steps.length) {
            const more = cur < tasks.length - 1;
            box.innerHTML = '<div class="think">' + (steps.length ? 'Du hast alle Hilfen zu dieser Aufgabe gesehen.' : 'Zu dieser Aufgabe gibt es keine Hilfen.') + '</div>' +
                (tasks.length > 1 && PRE !== 'all' ? '<button class="nbtn ready" style="animation:none" onclick="' + (more ? 'ghOpen(' + (cur + 1) + ')' : 'ghList()') + '"><span>' + (more ? 'Weiter zu ' + esc(name(tasks[cur + 1], cur + 1)) : 'Zur Übersicht') + '</span></button>' : '');
            return;
        }
        const s = steps[idx], isSol = !!s.isSolution, label = isSol ? 'Lösung' : 'Hilfe ' + (idx + 1);
        const T = TIMERS[CFG.timer] || TIMERS.fill, total = PRE === 'play' ? Math.min(s.time || 0, 3) : (s.time || 0);
        box.innerHTML = '<div class="think" id="think"></div><div class="tslot" id="tslot">' + (total > 0 ? T.html : '') + '</div><button class="nbtn' + (isSol ? ' solb' : '') + '" id="nb" disabled><i class="f"></i><span></span></button>' +
            (t.diffMode && !PRE ? '<button class="sub" onclick="ghSwitch()">Anderes Niveau wählen</button>' : '');
        const nb = $('nb'), lab = nb.querySelector('span'), f = nb.querySelector('.f'), slot = $('tslot'), think = $('think');
        nb.onclick = () => { reveal(false); arm(); };
        const ready = () => { nb.disabled = false; nb.classList.add('ready'); lab.textContent = label + ' anzeigen'; think.textContent = isSol ? 'Vergleiche zuerst mit deinem eigenen Ergebnis.' : (idx === 0 ? 'Kommst du allein nicht weiter?' : 'Brauchst du noch einen Tipp?'); };
        if (total <= 0) { slot.innerHTML = ''; ready(); return; }
        think.textContent = idx === 0 ? 'Überlege erst selbst.' : 'Probiere es mit diesem Tipp weiter.';
        const t0 = performance.now(), useFill = !T.html;
        (function tick(now) {
            const el = (now - t0) / 1000, p = Math.min(el / total, 1), left = Math.max(Math.ceil(total - el), 0), done = p >= 1;
            lab.textContent = label + ' in ' + fmt(left);
            if (useFill) f.style.width = (p * 100) + '%';
            else if (slot.firstChild) T.up(slot, p, left, done);
            if (done) { raf = 0; ready(); } else raf = requestAnimationFrame(tick);
        })(t0);
    }

    function levelPick(t) {
        $('segs').innerHTML = ''; $('next').innerHTML = '';
        $('area').innerHTML = '<span class="k" style="text-align:center;margin:20px 0 10px">Wie viel Hilfe möchtest du?</span><div class="lv">' +
            [0, 1, 2].filter(l => t.levels[l]).map(l => '<button onclick="ghLevel(' + l + ')"><span class="st">' + '★'.repeat(l + 1) + '</span><b>' + ['Leicht', 'Mittel', 'Schwer'][l] + '</b><small>' + ['viele kleine Schritte', 'normale Hilfen', 'nur kurze Tipps'][l] + '</small></button>').join('') + '</div>';
    }
    window.ghLevel = l => { const p = getP(); p['L' + cur] = l; p[cur] = 0; putP(p); ghOpen(cur); };
    window.ghSwitch = () => {
        if (idx > 0 && !confirm('Niveau wechseln? Die Hilfen dieser Aufgabe werden wieder verdeckt.')) return;
        const p = getP(); delete p['L' + cur]; delete p[cur]; putP(p); ghOpen(cur);
    };

    window.ghOpen = function (i) {
        stop(); cur = i; idx = 0; const t = tasks[i], p = getP();
        let lvl = p['L' + i]; if (PRE && CFG.previewLevel >= 0) lvl = CFG.previewLevel;
        const needLvl = t.diffMode && lvl === undefined && t.levels.filter(Boolean).length > 1;
        if (t.diffMode && lvl === undefined && !needLvl) lvl = firstLevel(t);
        steps = needLvl ? [] : (path(t, lvl) || []);
        app.innerHTML = '<div class="wrap"><div class="top">' + (tasks.length > 1 && !PRE ? '<button class="ib" onclick="ghList()" title="Zur Übersicht">' + IC.left + '</button>' : '') +
            '<div class="tt"><small>' + esc(CFG.title || 'Gestufte Hilfen') + '</small><h1>' + esc(name(t, i)) + '</h1></div>' +
            (tasks.length > 1 ? '<span class="pill">' + (i + 1) + ' / ' + tasks.length + '</span>' : '') + tools() + '</div><div class="segs" id="segs"></div>' +
            (t.text ? '<div class="card"><span class="k">Aufgabe</span><div class="body">' + t.text + '</div></div>' : '') +
            '<div id="area"></div></div><div class="next"><div class="next-in" id="next"></div></div>';
        math(app);
        if (needLvl) { levelPick(t); return; }
        const saved = PRE === 'all' ? steps.length : Math.min(p[i] || 0, steps.length);
        for (let k = 0; k < saved; k++) reveal(true);
        drawSegs(); arm();
    };

    // Übersicht aller Aufgaben mit allen Hilfen (für die Kontrolle durch die Lehrkraft, z. B. nach dem KI-Import)
    function sheet() {
        const block = (arr) => arr.map((s, k) => '<div class="card hint noanim' + (s.isSolution ? ' sol' : '') + '">' + stepHtml(s, k + 1).replace(/<button class="zb".*?<\/button>/, '') + '</div>').join('');
        app.innerHTML = '<div class="wrap sheet" style="padding-bottom:30px">' + tasks.map((t, i) =>
            '<h2>' + (i + 1) + '. ' + esc(name(t, i)) + '</h2>' + (t.text ? '<div class="card"><span class="k">Aufgabe</span><div class="body">' + t.text + '</div></div>' : '') +
            (t.diffMode ? [0, 1, 2].filter(l => t.levels[l]).map(l => '<h3>' + '★'.repeat(l + 1) + ' ' + ['Leicht', 'Mittel', 'Schwer'][l] + '</h3>' + block(path(t, l))).join('') : block(t.steps))).join('') + '</div>';
        math(app);
    }

    if (PRE === 'sheet') sheet();
    else if (tasks.length === 1 || PRE) ghOpen(Math.min(CFG.startTask || 0, tasks.length - 1));
    else ghList();
})();
</script>
</body>
</html>
